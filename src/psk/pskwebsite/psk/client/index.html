<!DOCTYPE html>
<html lang="hr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSK.demo — Sport i Casino</title>
  <meta name="description" content="Demonstracijska MERN aplikacija sportske kladionice i casina. Obrazovni projekt bez stvarnog novca." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b4bd4'/><text x='16' y='22' font-size='13' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>PSK</text></svg>" />
  <script>
    // apply the stored theme before first paint to avoid a flash
    try {
      var t = JSON.parse(localStorage.getItem('psk.theme') || '"dark"');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
